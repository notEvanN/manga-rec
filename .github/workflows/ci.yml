name: CI

# Runs on every pull request so problems are caught before merging.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, typecheck and format check
        run: npm run check
      - name: Build
        run: npm run build
